# objectx - Object Storage Docker Compose
# 本地开发测试环境：MinIO（S3 兼容） + RustFS（S3 兼容）

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===== MinIO =====
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    cpus: "0.5"
    container_name: hubx-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data/minio/data:/data
      - ./data/minio/config:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # ===== RustFS（S3 兼容，复用 minio-go 驱动） =====
  rustfs:
    image: rustfs/rustfs:latest
    cpus: "0.5"
    container_name: hubx-rustfs
    ports:
      - "9010:9000"   # S3 API + Console（宿主映射 9010 避免与 MinIO 冲突）
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - ./data/rustfs/data:/data
    # RustFS 无独立健康端点，/ 返回 403(需认证) 即证明 S3 API 存活
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/); test \"$$code\" -ge 400 -a \"$$code\" -lt 500"]
      interval: 30s
      timeout: 20s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: hubx-objectx-net
    driver: bridge
