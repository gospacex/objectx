objectx:
  standalone:
    - driver: qiniu
      name: default
      endpoint: "https://up.qiniup.com"
      access_key: "YOUR_QINIU_ACCESS_KEY"
      secret_key: "YOUR_QINIU_SECRET_KEY"
      bucket: "your-bucket-name"
      use_ssl: true
      max_upload_size: 104857600
      presigned_expiry: 24h
