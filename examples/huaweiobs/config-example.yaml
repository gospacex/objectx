objectx:
  standalone:
    - driver: huaweiobs
      name: default
      endpoint: "obs.cn-north-4.myhuaweicloud.com"
      access_key: "YOUR_HUAWEI_OBS_ACCESS_KEY"
      secret_key: "YOUR_HUAWEI_OBS_SECRET_KEY"
      bucket: "your-bucket-name"
      use_ssl: true
      max_upload_size: 104857600
      presigned_expiry: 24h
