# objectx/minio（MinIO S3） - 独立开发环境
# 用法：scripts/start.sh / scripts/verify.sh / scripts/stop.sh
# 服务定义与 objectx/docker-compose.yml 中对应段一致，只改了容器名与网络名前缀，
# 避免与根 compose（一次起全套）重名冲突。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    cpus: "0.5"
    container_name: hubx-objectx-minio
    ports:
      - "${HOST_PORT:-9000}:9000"   # S3 API
      - "9001:9001"                 # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data/minio/data:/data
      - ./data/minio/config:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: hubx-objectx-minio-net
    driver: bridge
